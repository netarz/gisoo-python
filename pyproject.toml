[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gisoo"
version = "0.1.0"
description = "Tiny helper that points the official OpenAI Python client at Gisoo (gisoo.pro), an OpenAI-compatible AI API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["openai>=1.0.0"]
keywords = ["openai", "llm", "ai-gateway", "persian", "gisoo"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://gisoo.pro"
Documentation = "https://gisoo.pro/docs"
Repository = "https://github.com/netarz/gisoo-python"

[tool.hatch.build.targets.wheel]
packages = ["src/gisoo"]
